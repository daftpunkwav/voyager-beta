[project]
name = "app"
version = "2.0.0"
description = "AI-driven open source project learning platform (monorepo root)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[tool.uv.workspace]
members = [
    "platform/contracts",
    "platform/actor",
    "platform/eventbus",
    "platform/capability",
    "platform/settings",
    "platform/health",
    "platform/secrets",
]

[tool.uv.sources]
platform-contracts = { workspace = true }
platform-actor = { workspace = true }
platform-eventbus = { workspace = true }
platform-capability = { workspace = true }
platform-settings = { workspace = true }
platform-health = { workspace = true }
platform-secrets = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # 未排序导入

[tool.ruff.lint.per-file-ignores]
# 继承/随附代码(非本服务手写):Python 回退引擎为旧实现迁移稿,C 引擎 scripts 为随附工具脚本
"services/graph/engines/python/**" = ["BLE001", "S110", "S112", "SIM102", "SIM103", "SIM115", "UP031", "PERF102", "PERF402", "PIE810", "PLW1510", "RUF013", "RUF059", "ISC004", "RUF007"]
"services/graph/engines/c/core/scripts/**" = ["BLE001", "S110", "S112", "SIM102", "SIM103", "SIM115", "UP031", "PERF102", "PERF402", "PIE810", "PLW1510", "RUF013", "RUF059", "ISC004", "RUF007"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["platform", "agent", "services/_template"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
norecursedirs = ["data", "vendor", ".venv", "node_modules", "build", "dist"]
