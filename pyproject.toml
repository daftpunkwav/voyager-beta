[project]
name = "app"
version = "2.0.0"
description = "AI-driven open source project learning platform (monorepo root)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "services/api",
    "services/agent",
    "services/graph_engine",
    "services/mcp",
    "packages/py-shared",
    "platform/contracts",
    "platform/actor",
    "platform/eventbus",
    "platform/capability",
    "platform/settings",
    "platform/health",
    "platform/secrets",
]

[tool.uv.sources]
py-shared = { workspace = true }
platform-contracts = { workspace = true }
platform-actor = { workspace = true }
platform-eventbus = { workspace = true }
platform-capability = { workspace = true }
platform-settings = { workspace = true }
platform-health = { workspace = true }
platform-secrets = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # 未排序导入

[tool.ruff.lint.per-file-ignores]
# ensure_service_paths() / sys.path hack 必须置于模块导入之前，属有意为之
"services/api/api_backend/main.py" = ["E402"]
"services/agent/agent_runtime/main.py" = ["E402"]
"services/api/api_backend/migrations/alembic/env.py" = ["E402"]
"tests/conftest.py" = ["E402"]  # sys.path 注入必须在 api_backend import 之前，属有意为之

[tool.mypy]
python_version = "3.11"
mypy_path = ["services/api", "services/agent", "services/graph_engine", "packages/py-shared"]
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services/api", "services/agent", "services/graph_engine", "packages/py-shared"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
norecursedirs = ["data", "vendor", ".venv", "node_modules", "openwiki", "build", "dist"]
