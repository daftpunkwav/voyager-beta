[project]
name = "py-shared"
version = "0.1.0"
description = "API / Agent / MCP 共享的 Python 模型与工具"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",  # AppException 基类（跨服务统一异常语义）
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "cryptography>=41.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py_shared"]
