# Alembic config for Voyager API
[alembic]
# %(here)s = dir of alembic.ini (repo root); absolutize path to work from any CWD (e.g. dev.ps1 starts uvicorn under services/api)
script_location = %(here)s/services/api/api_backend/migrations/alembic
prepend_sys_path = %(here)s/services/api
sqlalchemy.url =
# §4.3.4: leave empty; runtime injected by env.py via get_settings().database_url
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
