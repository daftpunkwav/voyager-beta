[project]
name = "platform-settings"
version = "0.1.0"
description = "设置项框架:schema/默认值/secret 标记/变更事件(§7.9)"
requires-python = ">=3.11"
dependencies = ["platform-contracts", "platform-eventbus"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_settings"]
