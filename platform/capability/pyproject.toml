[project]
name = "platform-capability"
version = "0.1.0"
description = "能力框架:一次定义 → REST + MCP 双协议生成;入口强制鉴权/限流/审计(§7.3)"
requires-python = ">=3.11"
dependencies = ["platform-contracts", "platform-actor"]

[project.optional-dependencies]
rest = ["fastapi>=0.104.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "fastapi>=0.104.0", "httpx>=0.25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_capability"]
