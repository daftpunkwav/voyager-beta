[project]
name = "agent"
version = "0.3.0"
description = "Voyager Agent 运行时 — Hub / Scout / Mentor 等"
requires-python = ">=3.11"
dependencies = [
    # §4.3.8: 与 api 重复的依赖（pydantic/sqlalchemy/httpx/fastapi/uvicorn/litellm/python-dotenv）
    # 中期通过 packages/py-shared 收敛；当前版本声明仍独立以避免破坏部署。
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "sqlalchemy>=2.0.0",
    "litellm>=1.40.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "py-shared",  # 共享模型/工具/Contract（workspace 内部包）
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime", "agent_core"]
