[project]
name = "api"
version = "2.0.0"
description = "Voyager API - unified backend (auth, projects, notes, graph, agent, settings)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "pyjwt[crypto]>=2.8.0",  # §4.2.12: 弃 python-jose
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "aiosqlite>=0.20.0",
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "py-shared",  # 共享模型/工具/Contract（workspace 内部包）
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api_backend"]
