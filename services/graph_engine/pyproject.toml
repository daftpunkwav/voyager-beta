[project]
name = "graph-engine"
version = "0.1.0"
description = "Voyager 自研图谱引擎（Python 编排层与可选 HTTP sidecar）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "py-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_engine_runtime", "graph_fallback"]
