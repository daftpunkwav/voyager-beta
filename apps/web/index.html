<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <!--
      主题首屏同步(§10.11):
      在 React 水合前根据 localStorage 持久化主题或系统偏好设置 data-theme,
      避免 system 模式下首屏闪烁。
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('%UI_STORE_KEY%')
            || localStorage.getItem('%UI_STORE_LEGACY_KEY%');
          var theme = stored ? JSON.parse(stored).state?.theme : null;
          if (theme === 'system' || !theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute(
            'data-theme',
            theme === 'dark' ? 'dark' : 'light'
          );
        } catch (e) {
          // 隐私模式/无 localStorage 时保持默认 light
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="%PRODUCT_NAME% — %PRODUCT_TAGLINE%" />
    <meta name="theme-color" content="#007aff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a2540" media="(prefers-color-scheme: dark)" />
    <!--
      Content Security Policy(§4.2 安全):
      - default-src 'self'   资源默认同源
      - script-src 'self' 'unsafe-inline'   Vite dev 需 unsafe-inline(HMR);生产构建无 inline
      - style-src 'self' 'unsafe-inline' fonts.googleapis.com   CSS 允许 inline(液态玻璃动态 token)+ Google Fonts
      - font-src 'self' fonts.gstatic.com data:   woff2 + 内嵌字体
      - img-src 'self' data: https:   头像/图标/外链
      - connect-src 'self' ws: wss: http://127.0.0.1:8000   同源 + WebSocket(SSE) + dev 后端
      - base-uri 'self'   防 base href 劫持
      - form-action 'self'   防 form 跨域提交
      - frame-ancestors 必须从 HTTP header 设置(meta 标签被浏览器忽略,W3C 规范);
        dev 在 vite.config.ts 的 server.headers 注入;prod 由 gateway 在响应头加
        'Content-Security-Policy: ...; frame-ancestors \"none\"'。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: https:;
        connect-src 'self' ws: wss: http://127.0.0.1:8000;
        base-uri 'self';
        form-action 'self';
      "
    />
    <title>%PRODUCT_NAME%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
