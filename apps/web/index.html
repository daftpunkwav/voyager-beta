<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Voyager — Agent 协作的本地工作台" />
    <meta name="theme-color" content="#007aff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a2540" media="(prefers-color-scheme: dark)" />
    <!--
      Content Security Policy(§4.2 安全):
      - default-src 'self'   资源默认同源
      - script-src 'self' 'unsafe-inline'   Vite dev 需 unsafe-inline(HMR);生产构建无 inline
      - style-src 'self' 'unsafe-inline' fonts.googleapis.com   CSS 允许 inline(液态玻璃动态 token)+ Google Fonts
      - font-src 'self' fonts.gstatic.com data:   woff2 + 内嵌字体
      - img-src 'self' data: https:   头像/图标/外链
      - connect-src 'self' ws: wss: http://127.0.0.1:8000   同源 + WebSocket(SSE) + dev 后端
      - frame-ancestors 'none'   防 clickjacking
      - base-uri 'self'   防 base href 劫持
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: https:;
        connect-src 'self' ws: wss: http://127.0.0.1:8000;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <title>Voyager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
